<mat-toolbar>
  <span class="logo">TransLog</span>

  <nav>
    <a mat-button routerLink="/shipments">
      Shipments
    </a>
    
    @if (currentUser?.role === 'SUPERVISOR') {
      <a mat-button routerLink="/register">
        Register
      </a>
    }
  </nav>

  <span class="spacer"></span>

  @if (currentUser) {
    <span class="user-info">
      {{ currentUser.email }}
    </span>
  }
  <button mat-button (click)="logout()">
    Logout
  </button>
</mat-toolbar>
