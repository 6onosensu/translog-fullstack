<app-header />

<main class="page-container">
  <h1>Shipments</h1>
  
  <table mat-table [dataSource]="shipments">
    <ng-container matColumnDef="trackingCode">
      <th mat-header-cell *matHeaderCellDef>Tracking Code</th>
      <td mat-cell *matCellDef="let shipment">
        {{ shipment.trackingCode }}
      </td>
    </ng-container>
    <ng-container matColumnDef="recipientName">
      <th mat-header-cell *matHeaderCellDef>Recipient</th>
      <td mat-cell *matCellDef="let shipment">
        {{ shipment.recipientName }}
      </td>
    </ng-container>
    <ng-container matColumnDef="destinationAddress">
      <th mat-header-cell *matHeaderCellDef>Destination</th>
      <td mat-cell *matCellDef="let shipment">
        {{ shipment.destinationAddress }}
      </td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let shipment">
        <span 
          class="status" 
          [class]="shipment.status.toLowerCase()"
        >
          {{ shipment.status }}
        </span>
      </td>
    </ng-container>
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let shipment">
        {{ shipment.createdAt | date:'dd/mm/yyyy hh:mm'}}
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>
  
</main>
